<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Cinema Mella</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <div class="login-page">

        <div class="login-box">

            <div class="login-logo">
                CINEMA <span>MELLA</span>
            </div>

            <h1>Admin Login</h1>

            <p class="login-subtitle">
                Sign in to manage Cinema Mella
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter admin email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="loginButton"
                >
                    Login
                </button>


                <p id="loginMessage"></p>

            </form>

        </div>

    </div>


    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- ADMIN JS -->
    <script src="admin.js"></script>

</body>

</html>
